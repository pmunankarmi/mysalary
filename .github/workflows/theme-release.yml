name: Build and publish theme update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mysalary-theme-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out theme source
        uses: actions/checkout@v4

      - name: Build installable theme package
        id: build
        shell: bash
        run: |
          set -euo pipefail

          BASE_VERSION="$(sed -nE 's/^Version:[[:space:]]*([0-9.]+).*$/\1/p' style.css | head -n 1)"
          if [[ -z "$BASE_VERSION" ]]; then
            echo "Could not read the base version from style.css" >&2
            exit 1
          fi

          BUILD_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          RELEASE_TAG="v${BUILD_VERSION}"

          mkdir -p dist/mysalary
          rsync -a ./ dist/mysalary/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude 'dist/' \
            --exclude '*.zip' \
            --exclude '.DS_Store'

          sed -i -E "s/^Version:[[:space:]]*.*/Version:           ${BUILD_VERSION}/" dist/mysalary/style.css
          sed -i -E "s/define\( 'MYSALARY_VERSION', '[^']+' \);/define( 'MYSALARY_VERSION', '${BUILD_VERSION}' );/" dist/mysalary/functions.php

          (
            cd dist
            zip -q -r -X mysalary.zip mysalary
          )

          echo "version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          unzip -t dist/mysalary.zip
          find dist/mysalary -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.build.outputs.tag }}
          BUILD_VERSION: ${{ steps.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/mysalary.zip \
            --target "$GITHUB_SHA" \
            --title "MySalary ${BUILD_VERSION}" \
            --generate-notes \
            --latest
